name: claude

# The interactive lane, and nothing else. `@cc <ask>` in a comment.
#
# 📌 The review lane lived here too and is now `review.yml`, deliberately in its
# own file. Any event here created a run in which the `review` job was SKIPPED,
# and GitHub counts a skipped job as satisfying a required status check — so the
# required `review` context reported green on PRs nobody had reviewed. Measured
# on #74: a skip even OVERWRITES an earlier red conclusion for the same context
# on the same head.
#
# Which triggers could actually do it, measured on #74 — it turns on whose sha
# the run carries:
#
#   pull_request: labeled          PR head sha  → the gate was reachable
#   pull_request_review_comment    PR head sha  → the gate was reachable
#   issue_comment                  DEFAULT branch sha → it never touched the PR
#
# So a reply on a review thread — the coder answering a finding — was itself
# enough to turn the gate green. Every trigger this file grows is a fresh way to
# mint a skipped `review`. There is no job named `review` here any more, and
# adding one back reopens the hole.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Noise comments (vercel, linear, renovate) must never share a group with a live
# assist run: with cancel-in-progress a vercel deploy comment cancelled a run on
# #64. The last term answers «is THIS comment asking for something».
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ contains(github.event.comment.body, '@cc') }}
  cancel-in-progress: true

jobs:
  assist:
    if: contains(github.event.comment.body, '@cc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Keeps the default token on purpose: assist writes code and opens
          # branches, which is the app that already has those rights. Only the
          # reviewer gets its own face.
          allowed_bots: "x-coder-cc[bot]"
          trigger_phrase: "@cc"
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --allowedTools "Bash(pnpm install),Bash(pnpm test:*),Bash(pnpm typecheck:*),Bash(pnpm check:*)"
