name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The label lane. `@claude review` in a comment still works and is the way to
  # ask for a re-review; the label is what a merge waits on.
  pull_request:
    types: [labeled]

# noise comments (vercel, linear, renovate) must never share a group with a live review:
# with cancel-in-progress a vercel deploy comment cancelled the first review run (#64)
#
# `github.event_name` is in the key because a pull_request event carries no
# comment body: without it every label run and every noise comment would land in
# the same `claude--false` group, and cancel-in-progress would let a vercel
# comment kill a review again — the exact bug the group was written for.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event_name }}-${{ contains(github.event.comment.body, '@claude') }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.label.name == '👀 review') ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "x-coder-bot[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Only the label lane gets a tracking comment. The action's own input
          # docs scope `track_progress` to pull_request and issue events, so on
          # the comment lane it would be inert at best — pinning it to the event
          # keeps the path that already works untouched.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }}

            the requester's own words, use them as the review focus when they say more than «review»:
            ${{ github.event.comment.body || 'the label was applied with no words — review the whole diff' }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # A green `review` check has to mean a review happened. The action can
      # stand down and still leave the step successful — measured on #70, where
      # it skipped itself because the workflow file differed from the default
      # branch, and the job went green with no review posted. Once this check is
      # required on main, that shape is a gate that passes empty, and it fires
      # precisely on the PRs that edit this file.
      #
      # So: look for something Claude actually wrote on this PR after the run
      # started, across all three surfaces. A PR that changes this workflow will
      # go red here until it is on main — that is the honest reading, not a bug.
      - name: A green review means a review was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          # A failed call counts as zero rather than killing the step: the point
          # is to prove a review exists, and an api hiccup proves nothing.
          count() {
            gh api "repos/$REPO/$1" \
              --jq "[.[] | select(.user.login == \"claude[bot]\" and (.created_at // .submitted_at) > \"$SINCE\")] | length" \
              2>/dev/null || echo 0
          }
          for attempt in 1 2 3; do
            total=$(( $(count "issues/$PR/comments") \
                    + $(count "pulls/$PR/comments") \
                    + $(count "pulls/$PR/reviews") ))
            if [ "$total" -gt 0 ]; then
              echo "review artifacts found: $total"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "no review artifact yet (attempt $attempt), waiting for the api to settle"
              sleep 10
            fi
          done
          echo "::error::The review job finished without posting a review. A green check here would claim a review that never happened."
          exit 1

  assist:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "x-coder-bot[bot]"
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --allowedTools "Bash(pnpm install),Bash(pnpm test:*),Bash(pnpm typecheck:*),Bash(pnpm check:*)"
