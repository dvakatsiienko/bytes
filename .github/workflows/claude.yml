name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# noise comments (vercel, linear, renovate) must never share a group with a live review:
# with cancel-in-progress a vercel deploy comment cancelled the first review run (#64)
concurrency:
  group: claude-${{ github.event.issue.number }}-${{ contains(github.event.comment.body, '@claude') }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "x-coder-bot[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}

            the requester's own words, use them as the review focus when they say more than «review»:
            ${{ github.event.comment.body }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

  assist:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "x-coder-bot[bot]"
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 30
            --allowedTools "Bash(pnpm install),Bash(pnpm test:*),Bash(pnpm typecheck:*),Bash(pnpm check:*)"
