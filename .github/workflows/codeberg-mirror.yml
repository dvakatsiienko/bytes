name: codeberg mirror

# pushes every branch and tag to codeberg.org/dvakatsiienko/<this repo>, the backup off github.
# a push to main mirrors at once; the nightly run mirrors every other branch and catches pushes made by github's own token,
# which never trigger a workflow. a pr branch push does not run it: two 504s from codeberg turned pr checks red.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: mirror to codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          dest="https://dvakatsiienko:${CODEBERG_TOKEN}@codeberg.org/dvakatsiienko/${REPO}.git"
          # a backup never mirrors destruction: no prune, and main + tags only fast-forward, so a rewrite turns this run red
          git push "$dest" '+refs/heads/*:refs/heads/*' '^refs/heads/main'
          git push "$dest" 'refs/heads/main:refs/heads/main' 'refs/tags/*:refs/tags/*'
