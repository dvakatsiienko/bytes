# The only thing that deploys production, since 2026-09-12 (BYT-84).
#
# Vercel's git integration used to do this by itself. It was turned off —
# `git.deploymentEnabled: false` in all six `vercel.json` — because of the
# hobby plan. Every push to any branch created six deployments, one per
# project, and the branch-prefix gates that were supposed to stop that only
# ever CANCELED them after creation. A canceled deployment still counts
# toward «Deployments Created per Day: 100» (Vercel's monorepo and limits
# docs, 2026-08), and the account reached 100/100 on 2026-09-11.
#
# So Vercel is still the build-and-deploy service — it clones, builds with its
# own cache, and keeps its own logs. It just no longer decides WHEN. This job
# does, by POSTing a per-project deploy hook for the apps turbo reports as
# affected. Measured on BYT-84: a deploy hook fires normally while the branch
# it builds carries `git.deploymentEnabled: false`.
#
# ⚠️ The one setting that WOULD break this is the deprecated
# `github.enabled: false`, which Vercel documents as disabling deploy hooks
# outright. No app sets it and none may.
#
# 📌 On a pro plan (6000 deployments/day) none of this would exist — the git
# integration would simply stay on. Revisit if the plan changes. The same note
# sits above «Deployment Settings» in the root CLAUDE.md.
#
# ⚠️ `[skip ci]` or `[ci skip]` in a commit subject skips every
# `push`-triggered workflow, this one included. A commit carrying one does NOT
# deploy, and the apps it changed stay stale in production until a later push
# touches them or somebody redeploys by hand from the Vercel dashboard.
#
# That directive used to be harmless here, because Vercel deployed whatever CI
# did. It is not harmless now: this job is the only trigger there is. GitHub
# gives a workflow no way to opt out of the directive, so the only guard is not
# using it on `main`.
#
# 🚨 The marker counts ANYWHERE in a commit message, body included — so writing
# ABOUT it is using it. A commit on BYT-84 that merely quoted it while
# describing this very paragraph produced no CI run and no review run at all,
# and the PR sat blocked for twenty minutes with nothing red to explain why:
# events still arrived, GitHub just created no run for them. In a commit
# message call it «the skip directive», never in brackets. Exactly the shape of
# Linear's banned keywords in the `cmt` skill — the message is parsed, not read.
#
# 📌 File contents are safe. GitHub reads commit messages only, which is why
# this header may spell the thing out; measured on this branch, where CI ran
# green on a tree already containing these lines.

name: Deploy

on:
  push:
    branches: [main]

  # The replacement for the Vercel dashboard's Redeploy button. With the git
  # integration off, a push to `main` and this are the only two ways anything
  # reaches production — so the manual door has to exist, for the cases a diff
  # cannot see: a root file that changes a build without moving a manifest, a
  # commit that carried the skip directive, a build that failed on Vercel's side.
  #
  # 📌 The options have to be spelled out; GitHub does not accept a computed
  # `choice` list. That makes this list a copy, and the script treats it as a
  # convenience rather than the truth — it validates the choice against
  # `apps/*/vercel.json` and fails loudly if the two have drifted apart.
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        default: all
        options:
          - all
          - cv
          - figmentation
          - financial
          - space-explorer-ui
          - trophy-sys
          - x-com-chat

# 🚨 NO `concurrency:` block, and it must stay that way — a shared group
# silently loses deployments. GitHub keeps at most one running and one
# pending run per concurrency group, so a third push EVICTS the second while it
# is still pending. Each run fires hooks only for the apps its own push
# touched, so an app changed only by the evicted push would never deploy and
# would sit stale in production with nothing red anywhere.
#
# Serialising was never needed for correctness anyway: a deploy hook builds the
# BRANCH TIP at the moment it is fired, not the commit that triggered it. Two
# overlapping runs therefore build the same code, and Vercel cancels its own
# duplicate builds of one version. The thing that must not be lost is a push's
# app LIST.
#
# A per-commit group was the first fix, and a reviewer pointed out it decided
# nothing — unique per run. Worse, a manual run and a push CAN share a sha,
# which quietly put the queue back. So there is no block at all, which is the
# honest version of the same intent.

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  deploy:
    name: deploy affected apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # It reads the repo and POSTs to Vercel. It writes nothing back to GitHub.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # turbo diffs this push's range, so the base commit has to be present.
          fetch-depth: 0

      # 📌 No `pnpm/action-setup`, no pnpm cache and no `pnpm install`, and that
      # is measured rather than hopeful. turbo answers `--affected --dry=json`
      # from the manifests and the lockfile alone and returns the IDENTICAL
      # package list it returns after a full workspace install — checked both
      # ways on BYT-84. The script fetches the pinned turbo with `npx`.
      #
      # It matters because this job is the whole distance between a merge and
      # production: the install it replaces costs 12-14 s in this repo's CI,
      # with another 4-6 s for the pnpm setup and a cache restore on top.
      #
      # 📌 The NET saving is smaller than those numbers, and saying otherwise
      # would be the overclaim a reviewer caught: `npx` now fetches turbo and
      # its platform binary on every run, and the `cache: pnpm` restore that
      # went away was not replaced. Still a clear win, just not the gross figure.
      # `--prefer-offline` buys nothing without a cache; an npm cache on this
      # step is the thing that would, and it is not done here.
      - uses: actions/setup-node@v7
        with:
          # setup-node reads engines.node, which moved to devEngines.runtime — unsupported there, so pin explicitly
          node-version: 24.0.2

      - name: Deploy
        env:
          # Empty on a manual run, which is how the script tells the two apart.
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOKS }}
        run: .github/scripts/deploy-main.sh
