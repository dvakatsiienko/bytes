# A Vercel preview on demand: the `🚀 deploy:preview` label on a PR deploys a
# preview of every app the PR affects and comments the urls. The label works as
# a button: the job takes it off again, so adding it once more redeploys.
#
# Previews are off by default since BYT-84 (the hobby plan's daily cap), and
# x-com-chat is the reason this exists: CI cannot build it (prerender calls
# Convex), so a preview is its only build check before a bump merges.
#
# 🚨 `pull_request_target`, not `pull_request`. This job holds VERCEL_TOKEN,
# which can deploy production too, and a `pull_request` run uses the PR's own
# copy of this file, so a PR could rewrite it to send the token anywhere.
# `pull_request_target` runs main's copy.
#
# 🚨 No program from the PR runs in this job, in any step: steps share the
# runner (`$GITHUB_ENV`, `$GITHUB_PATH`, the disk), so a «no secret» step is no
# boundary. The `vercel` CLI is installed from main's checkout before the PR's
# tree exists; the app list comes from the api's changed-file names; the PR's
# tree is checked out into `pr/` only to be uploaded, and Vercel builds it.
# turbo is NOT used here: run on the PR's tree it hands off to a binary the PR
# can commit under `node_modules` (proven by the verifier on #127). The cost:
# these files change only by merging.
name: preview

on:
  pull_request_target:
    types: [labeled]

# The key answers «is THIS event asking for a preview», never just «which PR»:
# any other label on the PR starts a run too, and a PR-only group would cancel
# a live preview (the trap `review.yml`'s concurrency comment tells).
concurrency:
  group: preview-${{ github.event.pull_request.number }}-${{ github.event.label.name == '🚀 deploy:preview' }}
  cancel-in-progress: true

jobs:
  preview:
    # A fork's PR is refused: Vercel would build its code with the projects'
    # preview environment variables.
    if: >-
      github.event.label.name == '🚀 deploy:preview' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # `gh pr edit --remove-label` goes through the issues api.
      issues: write
    steps:
      # 📌 Unpinned on purpose until #126 lands; its renovate preset pins these.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      # From main's checkout, with the registry spelled out, before the PR's
      # tree exists: nothing in the PR can steer which vercel lands here.
      - name: Install the vercel CLI
        env:
          # The CLI dima's mac runs; bump it here by hand.
          VERCEL_CLI: 60.1.3
        run: npm install --global --registry=https://registry.npmjs.org "vercel@$VERCEL_CLI"

      - name: Apps the PR touches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          .github/scripts/preview-apps.sh | tee "$RUNNER_TEMP/apps.txt"

      # Data only: uploaded by the deploy step, never run here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SRC: ${{ github.workspace }}/pr
        run: |
          set -o pipefail
          .github/scripts/preview-deploy.sh < "$RUNNER_TEMP/apps.txt" | tee "$RUNNER_TEMP/urls.txt"

      - name: Comment the urls and take the label off
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          urls="$RUNNER_TEMP/urls.txt"
          {
            echo "🚀 preview of \`${SHA:0:7}\` — $OUTCOME ([run]($RUN))"
            echo
            if [ -s "$urls" ]; then
              while read -r app url; do echo "- $app — $url"; done < "$urls"
            else
              echo "- no app deployed"
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr edit "$PR" --repo "$REPO" --remove-label '🚀 deploy:preview'
