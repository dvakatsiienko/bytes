name: review-answer

# The way out of the review cap, and the reason one has to exist: `review:clean`
# lives on a HEAD, the two-round cap lives on a BRANCH. Fixing a finding needs a
# push, a push makes a new head, and the new head has no check the cap would let
# anyone create — so any PR whose last allowed round found something could never
# go green on its own. #75 and #76 both ended that way, and Dima merged past a
# pending gate, which is the habit this lane exists to remove.
#
# So a push after the cap gets a cheap check with no reviewer in it: every
# finding of the last round carries a reply, the author has answered on the PR
# itself, and every commit since that review belongs to the author or the repo
# owner → `review:clean` goes green on the new head.
#
# 📌 What that green says is «the answers are in», not «the new code was
# reviewed». The reviewer's own `verdict:` line still gates the first green;
# this only carries an answered verdict forward onto the head that answers it,
# and it refuses to do even that unless the last round's verdict was `findings`
# — there is nothing to answer otherwise, and a push after a clean round is
# unreviewed code.
#
# It publishes a green or it publishes nothing — never a red. Every ordinary
# mid-work push reaches this, and a head with no check is already blocked, which
# is the safe default; painting those red would make a working PR look broken
# and teach everyone to ignore the colour.
#
# 🚨 This is a SEPARATE FILE and that is load-bearing, for the same reason
# `review.yml` is one. Rounds are counted as the successful runs of
# `review.yml`, and a workflow run concludes `success` when any job in it
# succeeds — so this job living inside `review.yml` made every push a completed
# review round. Two pushes then ate the whole cap, and `last`/`at`/`url` pointed
# at a push instead of a review, which made this very check unable to ever
# grant. Caught in review before it shipped. Keep one trigger per file.
on:
  pull_request:
    types: [synchronize]

concurrency:
  # Two pushes in a row cancel each other, which is what a per-head check wants:
  # only the newest head is worth judging. A review round is in the other file
  # and another group entirely, so a push can never cancel one.
  group: review-answer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  answer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Before the token step, so an ordinary mid-work push costs one api call
      # and stops there.
      - id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.event.pull_request.head.ref }}
        run: .github/scripts/review-rounds.sh

      # Minted for one field: the reviewer's own login, so this job follows the
      # app if it is ever renamed. Same reason the guard reads it from the token
      # step instead of writing it out.
      - id: reviewer
        if: steps.rounds.outputs.count >= 2
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.X_REVIEWER_CC_APP_ID }}
          private-key: ${{ secrets.X_REVIEWER_CC_PRIVATE_KEY }}

      - name: Publish review:clean when the last round's findings are answered
        if: steps.rounds.outputs.count >= 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: ${{ steps.reviewer.outputs.app-slug }}[bot]
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LAST: ${{ steps.rounds.outputs.last }}
          SINCE: ${{ steps.rounds.outputs.at }}
          RUN: ${{ steps.rounds.outputs.url }}
        run: .github/scripts/review-answered.sh
