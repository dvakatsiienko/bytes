name: review-round

# The review round itself — the cap and the reviewer — for every repo
# that has one. A repo opts in with a thin caller named `review.yml` that keeps
# the trigger, the concurrency key and the job name (bytes' own `review.yml`
# says why each of those is load-bearing) and calls this file at bytes `main`.
# One reviewer app, one prompt: a change here reaches bytes and frame
# together, and nothing drifts between them.
#
# 🚨 Callers call this at `@main`, never as `./`. A local call runs the copy on
# the PR's own head, so editing THIS file would change the round judging the
# PR. At `@main` it is the copy already merged. 📌 It does not stop a PR from editing its caller to
# point somewhere else — a `labeled` run takes the PR's copy of `review.yml`.
# Such a PR can still count a round: #138 edited `review.yml` and the action
# reviewed it. What holds this door is merge-auto's self-edit list, which names
# both files and asks for Dima's word. The cost: a PR that
# changes this file is reviewed by the old copy, and the very first PR that
# adds it finds nothing to call.
#
# Everything about the calling repo is read from it: `github.*` here is the
# caller's context, so the event, the PR, the repository and the token's repo
# are the caller's. Only the rounds script comes from bytes.
on:
  workflow_call:
    inputs:
      app-id:
        description: the x-reviewer-cc github app id (the caller's `vars.X_REVIEWER_CC_APP_ID`)
        required: true
        type: string
    secrets:
      X_REVIEWER_CC_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The caller's job must grant at least these: a called workflow can only
    # narrow the token it is handed, never widen it.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # The reviewer gets its own face. Without this it posts as `claude[bot]`,
      # the same identity as the assist lane and as any other Claude app on the
      # repo, so «who said this» is unanswerable from a thread.
      - id: reviewer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.X_REVIEWER_CC_PRIVATE_KEY }}

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 🚨 The cap reads with ITS OWN code, never the PR's. Everything the
      # checkout put in the workspace is the PR branch's copy, so a PR could
      # rewrite `review-rounds.sh` to report zero rounds and lift its own cap.
      #
      # 📌 It extracts ELSEWHERE, so the reviewer still sees the PR. The anchor
      # is BYTES' DEFAULT BRANCH, not the PR's base: a PR's base branch is
      # editable with `pull-requests: write` alone, the scope codie holds, and
      # the default branch is the one ref a PR cannot move. frame carries no
      # copy. bytes is public, so the fetch needs no token.
      - id: gate
        env:
          GATE_REPO: https://github.com/dvakatsiienko/bytes.git
          BASE: main
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/gate"
          mkdir -p "$dir"
          if git fetch --no-tags --depth=1 "$GATE_REPO" "$BASE" &&
             git archive FETCH_HEAD .github/scripts | tar -x -C "$dir"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            echo "rounds script taken from $GATE_REPO at $BASE"
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::no rounds script on the base revision — this round cannot read its cap"
          fi

      # Two things are read from the PREVIOUS review runs on this branch, and
      # they are read here because the action is about to overwrite the sticky
      # comment that would otherwise hold them.
      #
      # 📌 The source is the workflow run list, not the comment body. A run
      # records its own head sha and its own start time, so the delta needs no
      # parsing and cannot be broken by the sticky comment being rewritten —
      # which is exactly what the action does to it, seconds later, on every
      # round. The script carries why a round is counted the way it is.
      - id: rounds
        if: steps.gate.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.event.pull_request.head.ref }}
          # The caller's file, `owner/repo/.github/workflows/review.yml@ref`:
          # rounds are runs of the CALLER, since a called workflow has no runs
          # of its own.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GATE: ${{ steps.gate.outputs.dir }}
        run: "$GATE/.github/scripts/review-rounds.sh"

      # The cap. One round per PR, at «final»: the fix rounds are reviewed
      # locally by codie before each sixth sense round, which is faster
      # (Dima, 2026-10-22, PK-103 / FRM-72). A second is Dima's call, asked
      # through clio with a few words on what changed — so this fails early,
      # before spending the window rather than after.
      #
      # 📌 «Dima's word» is enforced rather than asked for. On a `labeled` event
      # `github.event.sender` IS the account that applied the label, so a round past
      # the cap runs only when the repo owner applied it himself. Codie holds
      # `pull-requests: write` and could otherwise lift its own cap, which is no
      # cap at all. Before this, a round past the cap was impossible for anyone
      # without editing this file, which the ticket named as the gap.
      - name: One review round per PR
        if: >-
          steps.rounds.outputs.count >= 1 &&
          github.event.sender.login != github.repository_owner
        run: |
          echo "::error::The review round already ran on this branch. Another needs Dima's word: he applies the label himself, with what changed since the last review."
          exit 1

      - uses: anthropics/claude-code-action@38c80c1a32cdbc0c6f34042464a0669d89363dde # v1
        with:
          github_token: ${{ steps.reviewer.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codie's own identity. It changed from `x-coder-bot[bot]` to
          # `x-coder-cc[bot]`, then to `x-codie-cc[bot]` (2026-10-29), and until this line caught up every review
          # codie asked for died on arrival with «Workflow initiated by
          # non-human actor».
          allowed_bots: "x-codie-cc[bot]"
          # Kept in step with the job's `if` above. The predicate is what gates;
          # this only stops the action's own default (`claude`) from disagreeing
          # with us about which label means a review.
          label_trigger: "🤖 review:requested"
          trigger_phrase: "@cc"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # One comment per PR rather than one per round, so the thread stays
          # readable when a PR is reviewed twice.
          use_sticky_comment: true
          include_fix_links: true
          # The lane is a pull_request event by definition now, which is the
          # scope the action's own docs give this input.
          track_progress: true
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            ${{ steps.rounds.outputs.last && format('This is a RE-REVIEW. You already reviewed this PR at {0}. Review the commits since that sha, plus the replies on your own open threads — not the whole diff again. Say plainly which of your earlier findings are now fixed, which are answered with a reason, and which still stand.', steps.rounds.outputs.last) || 'This is the first review of this PR. Review the whole diff.' }}

            Raise every finding you would block a merge on as an INLINE THREAD
            on the line it concerns, even when you also describe it in your
            comment. A thread is the only form the PR's author (codie) can answer in place:
            there is one round per PR, the fixes after it are checked against
            your threads, and findings that exist only as prose cannot be
            checked off at all. Prose is right for a summary
            and for anything you are not blocking on.

            Be terse. Every line you write is read back into the PR author's
            context on every one of its later turns, and one PR's review volume
            once took most of a five-hour usage window (bytes #84, 2026-09-12).
            One line per finding: file, line, what breaks, the fix. No praise,
            no recap of the diff, no restating the PR body, no closing essay.
            A re-review lists only what changed since your last round. A
            thread reply is at most three lines.
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # 🚨 The only stand-down signal. The action can refuse itself and still end
      # green, having posted nothing, so without this a refusal would count as a
      # round. Red here is uncounted, in the cap and in
      # `x lane merge-auto`, which reads this step's name: rename both together.
      # A failed read also lands red: that spends a second label, never a false round.
      # `performed_via_github_app` is the reviewer's mark on a sticky comment
      # another login first wrote; issue comments alone carry it.
      - name: A round with no review is red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          APP: ${{ steps.reviewer.outputs.app-slug }}
          SINCE: ${{ steps.started.outputs.at }}
          GATE_STATE: ${{ steps.gate.outputs.state }}
        run: |
          set -uo pipefail
          if [ "$GATE_STATE" != ok ]; then
            echo "::error::no rounds script on the base revision — the round ends red"
            exit 1
          fi
          jq --version
          for attempt in 1 2 3; do
            posted=$(for feed in "issues/$PR/comments" "pulls/$PR/comments" "pulls/$PR/reviews"; do
                gh api "repos/$REPO/$feed" --paginate
              done | jq -s --arg app "${APP:?}" --arg since "$SINCE" '[.[][]
                | select(.user.login == ($app + "[bot]") or (.performed_via_github_app.slug // "") == $app)
                | select((.updated_at // .submitted_at // "") > $since)] | length')
            [ "${posted:-0}" -gt 0 ] && exit 0
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::error::the reviewer posted nothing — a stand-down, not a round"
          exit 1
