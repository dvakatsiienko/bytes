name: review-round

# The review round itself — the cap, the reviewer, the gate — for every repo
# that has one. A repo opts in with a thin caller named `review.yml` that keeps
# the trigger, the concurrency key and the job name (bytes' own `review.yml`
# says why each of those is load-bearing) and calls this file at bytes `main`.
# One reviewer app, one prompt, one gate: a change here reaches bytes and frame
# together, and nothing drifts between them.
#
# 🚨 Callers call this at `@main`, never as `./`. A local call runs the copy on
# the PR's own head, so editing THIS file would change the round judging the
# PR. At `@main` it is the copy already merged, the same anchor the gate code
# below has always used. 📌 It does not stop a PR from editing its caller to
# point somewhere else — a `labeled` run takes the PR's copy of `review.yml`.
# That door is held the way it always was: the action refuses itself on a PR
# that edits a workflow, and the guard ends that round red. The cost: a PR that
# changes this file is reviewed by the old copy, and the very first PR that
# adds it finds nothing to call.
#
# Everything about the calling repo is read from it: `github.*` here is the
# caller's context, so the event, the PR, the repository and the token's repo
# are the caller's. Only the gate code comes from bytes.
on:
  workflow_call:
    inputs:
      app-id:
        description: the x-reviewer-cc github app id (the caller's `vars.X_REVIEWER_CC_APP_ID`)
        required: true
        type: string
    secrets:
      X_REVIEWER_CC_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    # The caller's job must grant at least these: a called workflow can only
    # narrow the token it is handed, never widen it.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      # Creating and completing the `review:clean` check run, which is the gate.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # The reviewer gets its own face. Without this it posts as `claude[bot]`,
      # the same identity as the assist lane and as any other Claude app on the
      # repo, so «who said this» is unanswerable from a thread.
      - id: reviewer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.X_REVIEWER_CC_PRIVATE_KEY }}

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 🚨 The gate judges with ITS OWN code, never the PR's. Everything the
      # checkout put in the workspace is the PR branch's copy, so without this a
      # PR could rewrite `review-guard.sh` to publish a green, or
      # `review-rounds.sh` to report zero rounds and lift its own cap. The job
      # holds `checks: write`, and the action's anti-tamper covers workflow
      # FILES — a script beside one is not a workflow file. Greptile found the
      # guard half, the reviewer the cap half.
      #
      # 📌 It extracts ELSEWHERE rather than restoring in place, and that is the
      # whole trick. Restoring into the worktree would show the reviewer the
      # base's copy of the very files the PR changes; doing it after the action
      # instead left the cap read running the PR's copy, four steps earlier. A
      # separate directory gets both — the reviewer sees the PR, the gate runs
      # the base. `git archive` also carries nothing the PR ADDED to that
      # directory, which a `checkout -- ` would have left sitting there.
      #
      # When the anchor has no gate — true only for the PR that first adds it —
      # nothing untrusted is run in its place. The reviewer still reviews; the
      # guard below refuses to judge and the round ends red and uncounted.
      #
      # 🚨 The anchor is BYTES' DEFAULT BRANCH, not the PR's base, and not the
      # calling repo's: frame carries no gate code, and one gate for every
      # caller is the point of this file. The base looks
      # like the right answer and is not: a PR's base branch is editable through
      # `PATCH /repos/{owner}/{repo}/pulls/{number}` with `pull-requests: write`
      # alone — the scope the coder holds, and the same scope this file's cap
      # comment names as the reason a cap must not be self-liftable. Point the
      # base at a branch carrying a `review-gate.jq` that returns success, push
      # once, and the job runs the reviewed party's gate while holding
      # `checks: write`. The default branch is the one ref a PR cannot move.
      # The reviewer found this on itself, one round after finding the file
      # version of the same hole.
      #
      # It costs one thing: a PR legitimately stacked on another branch is judged
      # by `main`'s gate rather than its base's. For infrastructure that only
      # ever lives on `main`, that is the right answer rather than a compromise.
      # Named outright rather than read from `job.workflow_repository` and
      # `job.workflow_sha`: those are newer than actionlint, and an empty one
      # would leave every round red. bytes is public, so the fetch needs no
      # token.
      - id: gate
        env:
          GATE_REPO: https://github.com/dvakatsiienko/bytes.git
          BASE: main
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/gate"
          mkdir -p "$dir"
          if git fetch --no-tags --depth=1 "$GATE_REPO" "$BASE" &&
             git archive FETCH_HEAD .github/review-gate.jq .github/scripts | tar -x -C "$dir"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            echo "gate code taken from $GATE_REPO at $BASE"
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::the gate is not on the base revision — this head cannot be judged"
          fi

      # Two things are read from the PREVIOUS review runs on this branch, and
      # they are read here because the action is about to overwrite the sticky
      # comment that would otherwise hold them.
      #
      # 📌 The source is the workflow run list, not the comment body. A run
      # records its own head sha and its own start time, so the delta needs no
      # parsing and cannot be broken by the sticky comment being rewritten —
      # which is exactly what the action does to it, seconds later, on every
      # round. The script carries why a round is counted the way it is.
      - id: rounds
        if: steps.gate.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.event.pull_request.head.ref }}
          # The caller's file, `owner/repo/.github/workflows/review.yml@ref`:
          # rounds are runs of the CALLER, since a called workflow has no runs
          # of its own.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GATE: ${{ steps.gate.outputs.dir }}
        run: "$GATE/.github/scripts/review-rounds.sh"

      # The cap. One round per PR, at «final»: the fix rounds are reviewed
      # locally by the coder before each verifier round, which is faster
      # (Dima, 2026-10-22, PK-103 / FRM-72). A second is Dima's call, asked
      # through clio with a few words on what changed — so this fails early,
      # before spending the window rather than after.
      #
      # 📌 Know what this costs now that the gate is real: `review:clean` lives
      # on a head sha, so a push after the round leaves the new head with
      # no check. `review-approved.yml` is the way out: Dima approves the head
      # and that publishes `review:clean` on it.
      #
      # 📌 «Dima's word» is enforced rather than asked for. On a `labeled` event
      # `github.event.sender` IS the account that applied the label, so a round past
      # the cap runs only when the repo owner applied it himself. The coder holds
      # `pull-requests: write` and could otherwise lift its own cap, which is no
      # cap at all. Before this, a round past the cap was impossible for anyone
      # without editing this file, which the ticket named as the gap.
      - name: One review round per PR
        if: >-
          steps.rounds.outputs.count >= 1 &&
          github.event.sender.login != github.repository_owner
        run: |
          echo "::error::The review round already ran on this branch. Another needs Dima's word: he applies the label himself, with what changed since the last review."
          exit 1

      # 📌 The check run is created AFTER the cap, never before. A check run is
      # keyed on (name, head sha) and GitHub shows the latest one, so creating it
      # first would mean a refused round past the cap replaces an already-green
      # `review:clean` with a fresh `in_progress` — blocking a PR that had
      # passed. A re-label on the same head does create a second check run with
      # this name, and the latest winning is exactly what a re-review wants.
      - id: check
        name: Open the review:clean check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" -X POST \
            -f name='review:clean' \
            -f head_sha="$SHA" \
            -f status=in_progress \
            -f output[title]='review running' \
            -f output[summary]='The reviewer is reading this head.' \
            --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "review:clean check run $id opened on $SHA"

      - uses: anthropics/claude-code-action@38c80c1a32cdbc0c6f34042464a0669d89363dde # v1
        with:
          github_token: ${{ steps.reviewer.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codie's own identity. It changed from `x-coder-bot[bot]` to
          # `x-coder-cc[bot]`, then to `x-codie-cc[bot]` (10-29), and until this line caught up every review the
          # coder asked for died on arrival with «Workflow initiated by
          # non-human actor».
          allowed_bots: "x-codie-cc[bot]"
          # Kept in step with the job's `if` above. The predicate is what gates;
          # this only stops the action's own default (`claude`) from disagreeing
          # with us about which label means a review.
          label_trigger: "🤖 review:requested"
          trigger_phrase: "@cc"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # One comment per PR rather than one per round, so the thread stays
          # readable when a PR is reviewed twice.
          use_sticky_comment: true
          include_fix_links: true
          # The lane is a pull_request event by definition now, which is the
          # scope the action's own docs give this input.
          track_progress: true
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            ${{ steps.rounds.outputs.last && format('This is a RE-REVIEW. You already reviewed this PR at {0}. Review the commits since that sha, plus the replies on your own open threads — not the whole diff again. Say plainly which of your earlier findings are now fixed, which are answered with a reason, and which still stand.', steps.rounds.outputs.last) || 'This is the first review of this PR. Review the whole diff.' }}

            Close with your verdict on a line of its own, exactly one of these
            two, lowercase, nothing else on the line:

            verdict: clean

            when nothing on this head is outstanding — you found nothing worth
            blocking a merge on, or every finding you raised is now fixed, or
            answered with a reason you accept.

            verdict: findings

            when anything still stands.

            A machine reads that line and nothing else of what you wrote: the
            `review:clean` check on this head is red unless it says clean, and
            red too if the line is missing, because a round nobody can read a
            conclusion from is a round nobody can act on. What made this line
            necessary is a round that put six findings in its comment, opened no
            inline thread, and was counted clean.

            Raise every finding you would block a merge on as an INLINE THREAD
            on the line it concerns, even when you also describe it in your
            comment. A thread is the only form the coder can answer in place:
            there is one round per PR, the fixes after it are checked against
            your threads, and findings that exist only as prose cannot be
            checked off at all. Prose is right for a summary
            and for anything you are not blocking on.

            Be terse. Every line you write is read back into the coder's
            context on every one of its later turns, and one PR's review volume
            once took most of a five-hour usage window (bytes #84, 2026-09-12).
            One line per finding: file, line, what breaks, the fix. No praise,
            no recap of the diff, no restating the PR body, no closing essay.
            A re-review lists only what changed since your last round. A
            thread reply is at most three lines.
          claude_args: |
            --model claude-opus-5-5
            --effort medium
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # The gate. A green `review:clean` means a review ran on this head, the
      # reviewer said itself that the head is clean, and nothing it found is
      # sitting unanswered.
      #
      # 📌 The reasoning lives with the code: `.github/scripts/review-guard.sh`
      # carries the three failure modes this exists for, and
      # `.github/review-gate.jq` carries the decision. That split is the
      # difference between a gate that is trusted and one that is proven — a
      # decision written in this yaml can only be exercised by spending a real
      # review round, and a PR that changes it makes the action refuse itself,
      # so the findings path could never be shown red first. In a file it is fed
      # saved payloads by `.github/scripts/review-cases.sh`, which CI runs on
      # every PR. Remove the verdict test from the jq and the #76 case turns
      # green again, which is what that suite is for.
      - id: guard
        name: A green review means a clean review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CHECK: ${{ steps.check.outputs.id }}
          # Read from the token step rather than written out, so the guard
          # follows the app automatically if the reviewer is ever renamed — the
          # `allowed_bots` line above is the lesson that made this worth doing.
          REVIEWER: ${{ steps.reviewer.outputs.app-slug }}[bot]
          # The same value without the `[bot]` suffix. The api reports it on an
          # issue comment as `performed_via_github_app.slug`, which is how the
          # gate recognises the reviewer's sticky comment even when the login on
          # it belongs to whoever created the comment first.
          APP: ${{ steps.reviewer.outputs.app-slug }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SINCE: ${{ steps.started.outputs.at }}
          GATE: ${{ steps.gate.outputs.dir }}
        run: |
          set -euo pipefail
          if [ "${{ steps.gate.outputs.state }}" != "ok" ]; then
            gh api "repos/$REPO/check-runs/$CHECK" -X PATCH \
              -f status=completed -f conclusion=failure \
              -f output[title]='the gate is not on the base revision' \
              -f output[summary]='This head can only be judged by the base revision of the gate, and the base carries none. The review above still ran — read it. This is the bootstrap case for the PR that first adds the gate.' \
              --jq '.conclusion'
            echo "delivered=yes" >> "$GITHUB_OUTPUT"
            echo "::error::the gate is not on the base revision — review:clean is red"
            exit 1
          fi
          "$GATE/.github/scripts/review-guard.sh"

      # A way out. Everything above can end the job early — a crash in the
      # action, a cancelled run, a step that throws. A check run left
      # `in_progress` reports as PENDING forever, and a required context that
      # never resolves is a PR nobody can merge without an admin override.
      #
      # 📌 Whether a verdict was delivered is read from the guard's own output,
      # never from the api. Asking the api would add a call that can fail, and a
      # failure here would end the run red — which un-counts a round that was
      # actually spent, the very leak the `rounds` step above was fixed for.
      # Greptile caught that on this PR. Nothing in this step may fail the job,
      # which is also why the patch tolerates its own error.
      - name: Never leave the check hanging
        if: always() && steps.guard.outputs.delivered != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CHECK: ${{ steps.check.outputs.id }}
        run: |
          set -uo pipefail

          # The id normally comes from the step that opened the check. It can be
          # missing: the run is cancelled between the POST and the write to
          # `$GITHUB_OUTPUT`, and the check exists with nothing holding its id.
          # Looking it up by head sha is the only way out for that one, and an
          # already-completed check is not matched, so a delivered verdict is
          # never overwritten. Greptile found this window.
          if [ -z "$CHECK" ]; then
            CHECK=$(gh api \
              "repos/$REPO/commits/$SHA/check-runs?check_name=review:clean&status=in_progress" \
              --jq '.check_runs[0].id // ""' 2>/dev/null || echo "")
          fi
          [ -n "$CHECK" ] || exit 0

          gh api "repos/$REPO/check-runs/$CHECK" -X PATCH \
            -f status=completed -f conclusion=failure \
            -f output[title]='the review round ended without a verdict' \
            -f output[summary]='The job stopped before the guard could judge it. Re-apply the label to run another round.' \
            --jq '.conclusion' \
            || echo "::warning::could not close review:clean — it stays pending and the PR stays blocked, which is the safe side"
