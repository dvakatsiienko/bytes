name: review

# The review lane lives in its OWN file, and that is the whole point of the file
# existing. It used to be a job inside `claude.yml`, next to the `issue_comment`
# and `pull_request_review_comment` triggers — so every comment on a PR created a
# run in which the `review` job was skipped. GitHub counts a SKIPPED job as
# satisfying a required status check, so that skip reported GREEN and the branch
# protection rule was satisfied by a review that never ran: #72 merged with its
# `review` check reading `skipping`.
#
# Measured on PR #74 (a scratch PR, 2026-09-11) with a job named `review` that
# was made to fail for real, then skipped on a later event for the same head:
#
#   label `kit`, job runs and fails   → review FAILURE
#   label `cv`,  job's `if` is false  → review SKIPPED
#
# The skip REPLACED the failure. A check run is keyed on (name, head sha) and
# protection reads the latest, so one unrelated label on a PR erases a red
# review and reports the required context as satisfied. The gate was not merely
# weak, it was reversible by anyone who could add a label.
#
# 📌 Which triggers could reach the gate turns on whose sha the run carries,
# also measured on #74:
#
#   pull_request: labeled        PR head sha         → reachable
#   pull_request_review_comment  PR head sha         → reachable
#   issue_comment                DEFAULT branch sha  → never touched the PR
#
# So a reply on a review thread — the coder answering a finding — was itself
# enough to green the gate, which is the worst of the three.
#
# 📌 The first two also run the PR BRANCH's copy of a workflow, not the default
# branch's (measured: a review-comment run on a branch that had renamed the job
# listed the RENAMED name). That is what makes removing the job from
# `claude.yml` take effect on the branch that removes it, rather than one merge
# later.
#
# Which is why this file publishes its verdict as a check run it creates itself.
# A head nobody labelled never gets a `review:clean` check at all — the required
# context stays PENDING and the merge is blocked. Silence blocks; only a clean
# review opens.
#
# 🚨 ONE trigger, ONE job, and that is load-bearing beyond the paragraph above:
# a round is counted as a successful run of THIS FILE, and a workflow run
# concludes `success` when any job in it succeeds. A second job on a second
# trigger here would make every one of its events a completed review round — the
# post-cap answer check was written into this file first, and two ordinary
# pushes would then have eaten the whole cap while spending zero reviews. It
# lives in `review-answer.yml`. Caught in review before it shipped.
on:
  pull_request:
    types: [labeled]

# The key answers «is THIS event asking for a review», never «does this PR carry
# the label». A run is created for every labelled event, an unrelated one like
# `trophy-sys` included; a label-PRESENCE test would drop that run into the live
# review's group and cancel-in-progress would kill the review (#64 through
# comments, then nearly again through labels on #70).
concurrency:
  group: review-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name == '🤖 review:requested' }}
  cancel-in-progress: true

jobs:
  # 📌 NOT named `review`, and that is load-bearing. A job's name IS the check
  # context it publishes, so a job called `review` here would still mint a
  # skipped `review` check on every unrelated label — satisfying the old
  # required context exactly as before, for as long as `main` still requires it.
  # With no job of that name anywhere in the repo, the old context can never be
  # reported by anything, so it blocks until branch protection is switched to
  # `review:clean`. The fix does not depend on that switch happening promptly.
  # CodeRabbit caught this.
  review-round:
    # The label is the ONLY way to start a review. `@claude review` in a comment
    # used to work too and is gone deliberately: two doors to one action means
    # two things to keep in step, and the comment door looked like an escape
    # hatch for a PR that edits this file — which it never was, because the
    # action refuses itself on such a PR whichever door opened it.
    #
    # 📌 Sharper than it was written: the refusal is about a workflow ALREADY on
    # the default branch. #75 created this file and the reviewer reviewed it
    # twice; every PR that edits it afterwards — this one included — gets a
    # stand-down and a red `review:clean`, which is why the gate's own decision
    # lives in a file with saved-payload cases rather than only in this yaml.
    #
    # 📌 The action ships its own `label_trigger` input and this predicate is
    # NOT it, deliberately. `label_trigger` is read inside the action, which is
    # five steps in: an unrelated label — `trophy-sys`, say — would start the
    # job, mint an app token and count rounds before the action stood down.
    # A job-level `if` never starts the job at all.
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == '🤖 review:requested'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      # Creating and completing the `review:clean` check run, which is the gate.
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The reviewer gets its own face. Without this it posts as `claude[bot]`,
      # the same identity as the assist lane and as any other Claude app on the
      # repo, so «who said this» is unanswerable from a thread.
      - id: reviewer
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.X_REVIEWER_CC_APP_ID }}
          private-key: ${{ secrets.X_REVIEWER_CC_PRIVATE_KEY }}

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Three things are read from the PREVIOUS review runs on this branch, and
      # they are read here because the action is about to overwrite the sticky
      # comment that would otherwise hold them.
      #
      # 📌 The source is the workflow run list, not the comment body. A run
      # records its own head sha and its own start time, so the delta needs no
      # parsing and cannot be broken by the sticky comment being rewritten —
      # which is exactly what the action does to it, seconds later, on every
      # round. The script carries why a round is counted the way it is.
      - id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.event.pull_request.head.ref }}
        run: .github/scripts/review-rounds.sh

      # The cap. Two rounds per PR: the one at «final», and one after the fixes.
      # A third is Dima's call, asked through cclio with a few words on what
      # changed — so this fails early, before spending the window rather than
      # after.
      #
      # 📌 Know what this costs now that the gate is real: `review:clean` lives
      # on a head sha, so a push after the second round leaves the new head with
      # no check. `review-answer.yml` is the way out when the findings are
      # answered; when they are not, the PR waits for Dima.
      #
      # 📌 «Dima's word» is enforced rather than asked for. On a `labeled` event
      # `github.event.sender` IS the account that applied the label, so a third
      # round runs only when the repo owner applied it himself. The coder holds
      # `pull-requests: write` and could otherwise lift its own cap, which is no
      # cap at all. Before this, a third round was impossible for anyone without
      # editing this file, which the ticket named as the gap.
      - name: Two review rounds per PR
        if: >-
          steps.rounds.outputs.count >= 2 &&
          github.event.sender.login != github.repository_owner
        run: |
          echo "::error::Two review rounds already ran on this branch. A third needs Dima's word: he applies the label himself, with what changed since the last review."
          exit 1

      # 📌 The check run is created AFTER the cap, never before. A check run is
      # keyed on (name, head sha) and GitHub shows the latest one, so creating it
      # first would mean a refused third round replaces an already-green
      # `review:clean` with a fresh `in_progress` — blocking a PR that had
      # passed. A re-label on the same head does create a second check run with
      # this name, and the latest winning is exactly what a re-review wants.
      - id: check
        name: Open the review:clean check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" -X POST \
            -f name='review:clean' \
            -f head_sha="$SHA" \
            -f status=in_progress \
            -f output[title]='review running' \
            -f output[summary]='The reviewer is reading this head.' \
            --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "review:clean check run $id opened on $SHA"

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.reviewer.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The coder's own identity. It changed from `x-coder-bot[bot]` to
          # `x-coder-cc[bot]`, and until this line caught up every review the
          # coder asked for died on arrival with «Workflow initiated by
          # non-human actor».
          allowed_bots: "x-coder-cc[bot]"
          # Kept in step with the job's `if` above. The predicate is what gates;
          # this only stops the action's own default (`claude`) from disagreeing
          # with us about which label means a review.
          label_trigger: "🤖 review:requested"
          trigger_phrase: "@cc"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # One comment per PR rather than one per round, so the thread stays
          # readable when a PR is reviewed twice.
          use_sticky_comment: true
          include_fix_links: true
          # The lane is a pull_request event by definition now, which is the
          # scope the action's own docs give this input.
          track_progress: true
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            ${{ steps.rounds.outputs.last && format('This is a RE-REVIEW. You already reviewed this PR at {0}. Review the commits since that sha, plus the replies on your own open threads — not the whole diff again. Say plainly which of your earlier findings are now fixed, which are answered with a reason, and which still stand.', steps.rounds.outputs.last) || 'This is the first review of this PR. Review the whole diff.' }}

            Close with your verdict on a line of its own, exactly one of these
            two, lowercase, nothing else on the line:

            verdict: clean

            when nothing on this head is outstanding — you found nothing worth
            blocking a merge on, or every finding you raised is now fixed, or
            answered with a reason you accept.

            verdict: findings

            when anything still stands.

            A machine reads that line and nothing else of what you wrote: the
            `review:clean` check on this head is red unless it says clean, and
            red too if the line is missing, because a round nobody can read a
            conclusion from is a round nobody can act on. What made this line
            necessary is a round that put six findings in its comment, opened no
            inline thread, and was counted clean.

            Raise every finding you would block a merge on as an INLINE THREAD
            on the line it concerns, even when you also describe it in your
            comment. A thread is the only form a later check can see answered:
            once the two-round cap is spent, a push is allowed through only when
            each of your threads carries a reply, and findings that exist only
            as prose cannot be checked off at all. Prose is right for a summary,
            for praise, and for anything you are not blocking on.
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # The gate. A green `review:clean` means a review ran on this head, the
      # reviewer said itself that the head is clean, and nothing it found is
      # sitting unanswered.
      #
      # 📌 The reasoning lives with the code: `.github/scripts/review-guard.sh`
      # carries the three failure modes this exists for, and
      # `.github/review-gate.jq` carries the decision. That split is the
      # difference between a gate that is trusted and one that is proven — a
      # decision written in this yaml can only be exercised by spending a real
      # review round, and a PR that changes it makes the action refuse itself,
      # so the findings path could never be shown red first. In a file it is fed
      # saved payloads by `.github/scripts/review-cases.sh`, which CI runs on
      # every PR. Remove the verdict test from the jq and the #76 case turns
      # green again, which is what that suite is for.
      - id: guard
        name: A green review means a clean review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CHECK: ${{ steps.check.outputs.id }}
          # Read from the token step rather than written out, so the guard
          # follows the app automatically if the reviewer is ever renamed — the
          # `allowed_bots` line above is the lesson that made this worth doing.
          REVIEWER: ${{ steps.reviewer.outputs.app-slug }}[bot]
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # The job-run link the action writes into its tracking comment,
          # whoever ends up owning that comment. Verified present in both the
          # «review in progress» body and the finished one.
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SINCE: ${{ steps.started.outputs.at }}
        run: .github/scripts/review-guard.sh

      # A way out. Everything above can end the job early — a crash in the
      # action, a cancelled run, a step that throws. A check run left
      # `in_progress` reports as PENDING forever, and a required context that
      # never resolves is a PR nobody can merge without an admin override.
      #
      # 📌 Whether a verdict was delivered is read from the guard's own output,
      # never from the api. Asking the api would add a call that can fail, and a
      # failure here would end the run red — which un-counts a round that was
      # actually spent, the very leak the `rounds` step above was fixed for.
      # Greptile caught that on this PR. Nothing in this step may fail the job,
      # which is also why the patch tolerates its own error.
      - name: Never leave the check hanging
        if: always() && steps.guard.outputs.delivered != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CHECK: ${{ steps.check.outputs.id }}
        run: |
          set -uo pipefail

          # The id normally comes from the step that opened the check. It can be
          # missing: the run is cancelled between the POST and the write to
          # `$GITHUB_OUTPUT`, and the check exists with nothing holding its id.
          # Looking it up by head sha is the only way out for that one, and an
          # already-completed check is not matched, so a delivered verdict is
          # never overwritten. Greptile found this window.
          if [ -z "$CHECK" ]; then
            CHECK=$(gh api \
              "repos/$REPO/commits/$SHA/check-runs?check_name=review:clean&status=in_progress" \
              --jq '.check_runs[0].id // ""' 2>/dev/null || echo "")
          fi
          [ -n "$CHECK" ] || exit 0

          gh api "repos/$REPO/check-runs/$CHECK" -X PATCH \
            -f status=completed -f conclusion=failure \
            -f output[title]='the review round ended without a verdict' \
            -f output[summary]='The job stopped before the guard could judge it. Re-apply the label to run another round.' \
            --jq '.conclusion' \
            || echo "::warning::could not close review:clean — it stays pending and the PR stays blocked, which is the safe side"
