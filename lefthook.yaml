pre-commit:
  jobs:
    - run:
        npx @biomejs/biome check --write --no-errors-on-unmatched
        --files-ignore-unknown=true {staged_files}
      glob:
        - '*.js'
        - '*.js'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.json'
        - '*.jsonc'
        - '*.css'
      stage_fixed: true

    # A manifest printed at random used to land and get re-sorted by hand later.
    # The check ships with plugin-x, next to the convention it enforces, so this
    # repo runs the rules rather than carrying a copy. Only fires when a manifest
    # is actually staged.
    #
    # The `if` guard skips silently for a clone that does not have plugin-x on
    # PATH. It is deliberately not `… && package-json-shape . || true`: that form
    # also swallows a REAL failure, so the gate would never fire for us either
    # (measured — the `|| true` covers both branches).
    # Both globs are needed: `**/package.json` does not match a top-level
    # `package.json`, so the root manifest — the one most often hand-edited —
    # used to slip through unchecked.
    - name: package-json-shape
      glob:
        - 'package.json'
        - '**/package.json'
      run: if command -v package-json-shape >/dev/null; then package-json-shape . {staged_files}; fi

pre-push:
  jobs:
    # Links each pushed commit to the ticket its body names, and reverses the
    # writes Linear's own integration still makes. The script lives in dotfiles
    # and is shared, not forked — one implementation, two callers. The path is absolute on purpose: if it
    # ever rots, node exits non-zero and the push fails LOUD rather than the
    # hook quietly not running.
    #
    # {1} and {2} are git's own pre-push argv — remote name and remote url — and
    # the url is the guard that keeps this off repos we do not own. use_stdin
    # hands this job git's ref lines.
    #
    # It must never fail a push for its own reasons: the script swallows
    # everything and exits 0.
    - name: linear-push
      use_stdin: true
      run: node /Users/dima/dotfiles/script/linear-push.ts hook {1} {2}

    # Typecheck only what moved since origin/main, so a kit consumer that
    # breaks under vercel's install never leaves the machine.
    - name: typecheck-changed
      run: pnpm turbo typecheck --filter='...[origin/main]'

commit-msg:
  jobs:
    # Strips the `Claude-Session:` trailer the desktop harness asks agents to
    # append; the `Agent:` trailer is the fingerprint, this one is noise.
    - name: session-trailer
      run: sed -i '' -e '/^Claude-Session:/d' {1}

    # GitHub honours a CI-skip marker ANYWHERE in a commit message, body
    # included, and it skips every push- and pull_request-triggered workflow.
    # Since BYT-84 that includes `deploy.yml`, which is now the only thing that
    # deploys production — so one of these in a message means the commit
    # reaches `main` and ships nothing, with no failing check to say so.
    #
    # This exists because writing ABOUT the marker is using it: a BYT-84 commit
    # that merely quoted it while documenting this exact hazard produced no CI
    # run and no review run, and the PR sat blocked with nothing red for twenty
    # minutes. The message is parsed, not read — the same trap as Linear's
    # keywords, and the same answer: a mechanical guard, not a good intention.
    #
    # Describe it in prose instead: «the skip directive», never in brackets.
    - name: no-ci-skip-marker
      run: |
        if grep -qiE '\[(skip[ -]?(ci|actions)|(ci|actions)[ -]?skip|no[ -]?ci)\]' {1}; then
          echo "commit-msg: this message contains a CI-skip marker, which would stop deploy.yml — the only thing that deploys production. Write «the skip directive» in prose instead of the bracketed form."
          exit 1
        fi
