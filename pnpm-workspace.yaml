packages:
  - apps/*
  - packages/*

allowBuilds:
  '@apollo/protobufjs': true
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  oxc-resolver: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.4'
  - '@ai-sdk/groq@4.0.1'
  - '@ai-sdk/mcp@2.0.3'
  - '@ai-sdk/provider-utils@5.0.1'
  - '@ai-sdk/react@4.0.5'
  - ai@7.0.4
  - '@tanstack/react-router@1.170.29 || 1.170.30'
  - '@tanstack/router-core@1.171.24 || 1.171.25'
  - psn-api@2.18.1
  - lucide-react@1.32.0
  - cn@0.2.6
  - cva@1.0.0-beta.9
  - '@react-three/fiber@9.8.1'
  - its-fine@2.1.1
  - three@0.186.1

# one @types/react copy: @visx/event (via prisma studio) still ranges 19.2.x and next's styled-jsx types
# resolve the hoisted copy. drop the block when `pnpm why @types/react` shows one version without it.
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
